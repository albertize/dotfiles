# Resolve every theme color through the terminal's ANSI palette.
set -g status-style "fg=colour7,bg=colour0"
set -g message-style "fg=colour0,bg=colour3,bold"
set -g message-command-style "fg=colour0,bg=colour3"
set -g mode-style "fg=colour0,bg=colour6,bold"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g display-panes-colour colour4
set -g display-panes-active-colour colour3
set -g clock-mode-colour colour4

set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 0
set -g status-left "#[fg=colour0,bg=colour6,bold] #S #[fg=colour7,bg=colour0,nobold]"
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format "#[fg=colour7,bg=colour0] #I:#W "
set -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I:#W "
set -g window-status-activity-style "fg=colour3,bg=colour0,bold"
set -g window-status-bell-style "fg=colour15,bg=colour1,bold"

set -g mouse on
set -g extended-keys-format csi-u
set -g extended-keys on

# Open new windows and panes in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -c "#{pane_current_path}"
unbind %
bind % split-window -h -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
