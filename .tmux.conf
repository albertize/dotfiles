# enables the mouse
set -g mouse on

# Statusbar on top
set -g status-position top

# Catppuccin Macchiato status bar
# Palette: https://github.com/catppuccin/catppuccin
set -g status-style "bg=#181926,fg=#cad3f5"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 0
set -g window-status-separator ""

# Session and visual window tabs
set -g status-left "#[fg=#24273a,bg=#8aadf4,bold] 󰆍 #S #[fg=#cad3f5,bg=#181926,nobold]"
set -g window-status-format "#[fg=#cad3f5,bg=#363a4f] #I:#W #[fg=#cad3f5,bg=#181926]"
set -g window-status-current-format "#[fg=#24273a,bg=#c6a0f6,bold] #I:#W #[fg=#cad3f5,bg=#181926,nobold]"
set -g window-status-activity-style "fg=#f5a97f,bold"
set -g window-status-bell-style "fg=#ed8796,bold"

# Keep the right side empty.
set -g status-right ""

# Matching panes and messages
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#a6da95"
set -g mode-style "bg=#c6a0f6,fg=#24273a,bold"

# Set extended keys
set -g extended-keys-format csi-u
set -g extended-keys on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
