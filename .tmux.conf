# enables the mouse
set -g mouse on

# Statusbar on top
set -g status-position top

# The active global profile owns all status-bar and pane colors.
run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-theme/tmux.conf"'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 0
set -g window-status-separator ""
set -g status-right ""

# Set extended keys
set -g extended-keys-format csi-u
set -g extended-keys on

# Open new windows/panes in the current pane's working directory
bind c new-window -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -c "#{pane_current_path}"
unbind %
bind % split-window -h -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
