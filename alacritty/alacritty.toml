general.import = ["~/.config/alacritty/themes/catppuccin-macchiato.toml"]

[font]
size = 11.0

[font.normal]
family = "Noto Sans Mono"
style = "Regular"

[window.dimensions]
columns = 110
lines = 28

[window.padding]
x = 4
y = 4

[terminal]
shell = { program = "/bin/bash", args = ["-c", "tmux attach-session"] }
