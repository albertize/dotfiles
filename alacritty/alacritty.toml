general.import = ["~/.config/alacritty/themes/catppuccin-macchiato.toml"]

[font]
size = 11.0

[font.normal]
family = "Noto Sans Mono"
style = "Regular"

[window.dimensions]
columns = 110
lines = 28

[window.padding]
x = 4
y = 4

[terminal]
# Attach to an existing tmux session, or create one when none exists.
shell = { program = "/bin/bash", args = ["-c", "tmux has-session 2>/dev/null && exec tmux attach-session || exec tmux new-session"] }
