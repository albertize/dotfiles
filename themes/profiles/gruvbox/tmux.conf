# Gruvbox Dark
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left "#[fg=#282828,bg=#d65d0e,bold] 󰆍 #S #[fg=#ebdbb2,bg=#1d2021,nobold]"
